[project]
name = "mockpay"
version = "1.0.0"
description = "MockPay: a mock payment gateway for learning orders, checkout, signed webhooks, refunds and settlements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
mockpay = "mockpay.main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient now prefers the new `httpx2` package. MockPay uses
    # the well-known `httpx` for its webhooks, and the TestClient works with it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
