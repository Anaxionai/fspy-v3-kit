[project]
name = "paisalens"
version = "0.1.0"
description = "PaisaLens: see where your money went, from a UPI bank statement."
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0",
    "typer>=0.29",
]

[project.scripts]
# TODO(task 22): point this script at the Typer app in cli.py instead of main().
paisalens = "paisalens:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
