# ReelPipe's worker in Docker. The emulators come from the kit's cloud lab, not from this file.
# From reelpipe/ in Git Bash:
#   docker compose up --build worker      build the image and start the worker (task 10)
#   docker compose kill worker            crash it on purpose (task 12)
name: reelpipe

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - path: .env
        required: false # lets `docker compose config` work before you copy .env.example to .env
    environment:
      # Inside a container, localhost is the container itself. Docker Desktop points
      # host.docker.internal at your laptop, where the cloud lab publishes its ports.
      # These lines replace the localhost values from .env for the worker only.
      # TODO(task 10): add AWS_ENDPOINT_URL here, with an address the container can use to reach Floci.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://host.docker.internal:10000/devstoreaccount1;QueueEndpoint=http://host.docker.internal:10001/devstoreaccount1;TableEndpoint=http://host.docker.internal:10002/devstoreaccount1;"
      STORAGE_EMULATOR_HOST: http://host.docker.internal:4443
      PUBSUB_EMULATOR_HOST: host.docker.internal:8085
    extra_hosts:
      # Docker Desktop knows host.docker.internal already. Docker Engine on Linux needs this line.
      - "host.docker.internal:host-gateway"
