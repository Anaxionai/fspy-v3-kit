# Prometheus settings for Shortly (task 7). compose.yaml mounts this file and alerts.yml
# in /etc/prometheus/. After you change either file: docker compose restart prometheus
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shortly-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
