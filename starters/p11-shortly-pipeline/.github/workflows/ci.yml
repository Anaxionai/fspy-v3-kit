    # TODO(task 9): the same paths: filter as pull_request.
  # TODO(task 14): add workflow_dispatch, with one input named tag: the image tag to deploy.

defaults:
  run:
    # TODO(task 9): your shortly/ folder's path from the repository root. Step 1 of task 9 prints
    #   it with `git rev-parse --show-prefix`. Every run step then starts in shortly/.
