# Shortly's pipeline (P11): a skeleton. You write every step.
#
# Keep two identical copies of this file:
#   .github/workflows/shortly-ci.yml          at the repository root: GitHub and act run this one
#   shortly/.github/workflows/ci.yml          in the task folder: AxReview reads this one
# In every P11 task, point the paths and the working directory at that task's shortly/ folder.
#
# Each job ends with a step that fails on purpose ("TODO ... && exit 1"). Replace it with your
# steps. A job with `if: false` is switched off until its task: then replace that line.
