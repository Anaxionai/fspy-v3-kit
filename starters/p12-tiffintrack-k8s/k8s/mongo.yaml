apiVersion: apps/v1
kind: Deployment # TODO(task 20): a StatefulSet
metadata:
  name: mongo
spec:
  # TODO(task 20): serviceName, the headless Service below, which gives the pod its name (mongo-0).
  replicas: 1
  selector:
    matchLabels: # TODO(task 8): the label that picks this pod
  template:
    metadata:
      labels: # TODO(task 8): the same label
    spec:
      containers:
        - name: mongo
          image: # TODO(task 8): MongoDB 7
          ports:
            - containerPort: # TODO(task 8): the port MongoDB listens on
          # TODO(task 10): env MONGO_INITDB_ROOT_USERNAME, and MONGO_INITDB_ROOT_PASSWORD from the
          #   Secret tiffintrack-secrets (key MONGO_PASSWORD) with secretKeyRef.
          # TODO(task 20): args that keep MongoDB's cache small, and volumeMounts: the volume data at /data/db.
          # TODO(task 22): resources: CPU and memory requests and limits.
  # TODO(task 20): volumeClaimTemplates: one claim named data, with the size from the brief.
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  type: ClusterIP
  # TODO(task 20): clusterIP: None, which makes this Service headless.
  selector: # TODO(task 8): the MongoDB pod's label
  ports:
    - port: # TODO(task 8): the port other pods call
      targetPort: # TODO(task 8): the container's port
