# Alembic settings for the RailSeat API.
# Run every alembic command from railseat/api/, the folder that holds this file.
# The database URL is not set here: alembic/env.py reads DATABASE_URL from
# app/db.py, so the app and its migrations always use the same database.

[alembic]
# Where the migration environment and the migration files live.
script_location = %(here)s/alembic

# Lets alembic/env.py import the `app` package from this folder.
prepend_sys_path = .

# Split the paths above with the operating system's own separator.
path_separator = os

# Logging: what Alembic prints while it works.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
